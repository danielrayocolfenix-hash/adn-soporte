name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: adn_soporte
          POSTGRES_USER: adn_soporte
          POSTGRES_PASSWORD: adn_soporte
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U adn_soporte"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]

    env:
      DJANGO_SETTINGS_MODULE: config.settings.testing
      DJANGO_SECRET_KEY: ci-secret-key
      POSTGRES_DB: adn_soporte
      POSTGRES_USER: adn_soporte
      POSTGRES_PASSWORD: adn_soporte
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements/testing.txt

      - run: black --check .
      - run: isort --check-only .
      - run: flake8
      - run: pytest
